services:
  env-postgres:
    image: postgres:18.6-bookworm
    container_name: postgres-filmshelf
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - filmshelf_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  migration:
    image: migrate/migrate:v4.20.1
    container_name: migrate-filmshelf
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
      
volumes:
  filmshelf_pgdata:
